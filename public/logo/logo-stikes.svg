<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="stikesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d082"/>
      <stop offset="100%" stop-color="#057a4a"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle Border -->
  <circle cx="100" cy="100" r="92" fill="url(#stikesBg)" stroke="#00d082" stroke-width="6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fef84c" stroke-width="3"/>

  <!-- Medical Caduceus & Torch Symbol -->
  <g transform="translate(100, 95)">
    <!-- Torch Flame -->
    <path d="M 0,-48 C -12,-35 -8,-18 0,-10 C 8,-18 12,-35 0,-48 Z" fill="#fef84c" stroke="#eab308" stroke-width="1.5"/>
    <path d="M 0,-40 C -6,-30 -4,-18 0,-12 C 4,-18 6,-30 0,-40 Z" fill="#00d082"/>
    
    <!-- Torch Handle -->
    <rect x="-4" y="-10" width="8" height="42" rx="2" fill="url(#emeraldGrad)"/>
    
    <!-- Open Book / Education -->
    <path d="M -35,5 C -20,0 -5,2 0,10 C 5,2 20,0 35,5 L 32,25 C 18,20 5,22 0,28 C -5,22 -18,20 -32,25 Z" fill="#ffffff" stroke="#00d082" stroke-width="2"/>
    
    <!-- Rays of light -->
    <line x1="-30" y1="-25" x2="-40" y2="-32" stroke="#fef84c" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="-25" x2="40" y2="-32" stroke="#fef84c" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-54" x2="0" y2="-62" stroke="#fef84c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="100" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#065538" text-anchor="middle" letter-spacing="1.5">
    STIKES BORNEO NUSANTARA
  </text>
  <text x="100" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#00d082" text-anchor="middle" letter-spacing="1">
    BANJARMASIN
  </text>
</svg>
