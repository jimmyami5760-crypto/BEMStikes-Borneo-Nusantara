<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d082"/>
      <stop offset="100%" stop-color="#00965e"/>
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef84c"/>
      <stop offset="100%" stop-color="#f5e02a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Pentagon Shield -->
  <polygon points="100,10 185,55 160,175 100,195 40,175 15,55" fill="url(#bemBg)" stroke="#fef84c" stroke-width="5" filter="url(#glow)"/>
  
  <!-- Inner Rim -->
  <polygon points="100,22 173,61 150,165 100,182 50,165 27,61" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Radiation / Radiology Symbol in Center -->
  <g transform="translate(100,105)">
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="14" fill="url(#yellowAccent)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Fan Blades / Trefoil Radiation Symbol with modern glow -->
    <!-- Blade 1 (Top) -->
    <path d="M -12,-20 A 42,42 0 0,1 12,-20 L 0,-2 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M -9,-24 A 42,42 0 0,1 9,-24 L 0,-8 Z" fill="url(#yellowAccent)"/>
    
    <!-- Blade 2 (Bottom Right) -->
    <g transform="rotate(120)">
      <path d="M -12,-20 A 42,42 0 0,1 12,-20 L 0,-2 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M -9,-24 A 42,42 0 0,1 9,-24 L 0,-8 Z" fill="url(#yellowAccent)"/>
    </g>

    <!-- Blade 3 (Bottom Left) -->
    <g transform="rotate(240)">
      <path d="M -12,-20 A 42,42 0 0,1 12,-20 L 0,-2 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M -9,-24 A 42,42 0 0,1 9,-24 L 0,-8 Z" fill="url(#yellowAccent)"/>
    </g>

    <!-- Medical Cross in Center -->
    <path d="M -3,-7 L 3,-7 L 3,-3 L 7,-3 L 7,3 L 3,3 L 3,7 L -3,7 L -3,3 L -7,3 L -7,-3 L -3,-3 Z" fill="#00965e"/>
  </g>

  <!-- Banner text / Arc -->
  <text x="100" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    BEM RADIOLOGI
  </text>
  <text x="100" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#fef84c" text-anchor="middle" letter-spacing="1">
    STIKES BORNEO NUSANTARA
  </text>
</svg>
