<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="alaraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d082"/>
      <stop offset="100%" stop-color="#056142"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#alaraBg)"/>

  <!-- Trefoil symbol background -->
  <g transform="translate(620, 250)" opacity="0.18">
    <circle cx="0" cy="0" r="140" fill="#fef84c"/>
  </g>

  <!-- ALARA Pillars Graphic Cards -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#fef84c"/>
    <text x="70" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#064e3b" text-anchor="middle">ARTIKEL MEDIS</text>
    
    <text x="0" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff">
      Prinsip ALARA &amp; Proteksi Radiasi
    </text>
    <text x="0" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#fef84c">
      As Low As Reasonably Achievable
    </text>

    <!-- 3 Pillars -->
    <!-- Pillar 1: Time -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="200" height="180" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.15))"/>
      <circle cx="100" cy="55" r="30" fill="#00d082" opacity="0.2"/>
      <text x="100" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" text-anchor="middle">⏱️</text>
      <text x="100" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#064e3b" text-anchor="middle">TIME</text>
      <text x="100" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Waktu Paparan</text>
      <text x="100" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00d082" text-anchor="middle">Seminimal Mungkin</text>
    </g>

    <!-- Pillar 2: Distance -->
    <g transform="translate(240, 160)">
      <rect x="0" y="0" width="200" height="180" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.15))"/>
      <circle cx="100" cy="55" r="30" fill="#fef84c" opacity="0.4"/>
      <text x="100" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" text-anchor="middle">📏</text>
      <text x="100" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#064e3b" text-anchor="middle">DISTANCE</text>
      <text x="100" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Jarak Sumber</text>
      <text x="100" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00d082" text-anchor="middle">Sejauh Mungkin</text>
    </g>

    <!-- Pillar 3: Shielding -->
    <g transform="translate(480, 160)">
      <rect x="0" y="0" width="200" height="180" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.15))"/>
      <circle cx="100" cy="55" r="30" fill="#00d082" opacity="0.2"/>
      <text x="100" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" text-anchor="middle">🛡️</text>
      <text x="100" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#064e3b" text-anchor="middle">SHIELDING</text>
      <text x="100" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Pelindung Pb</text>
      <text x="100" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00d082" text-anchor="middle">Apron &amp; Barrier</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="450" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    Keselamatan Pasien &amp; Radiografer: Prioritas Utama BEM STIKes Borneo Nusantara
  </text>
</svg>
