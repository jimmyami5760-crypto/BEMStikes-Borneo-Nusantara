<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="seminarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c1e"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#00d082"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#seminarBg)"/>
  
  <!-- Glowing circle graphic -->
  <circle cx="650" cy="120" r="150" fill="#fef84c" opacity="0.12"/>
  <circle cx="150" cy="380" r="180" fill="#00d082" opacity="0.15"/>

  <!-- CT Gantry / Donut Graphic -->
  <g transform="translate(480, 150)">
    <circle cx="120" cy="120" r="110" fill="none" stroke="#fef84c" stroke-width="8" stroke-dasharray="14,8"/>
    <circle cx="120" cy="120" r="80" fill="#0b2319" stroke="#ffffff" stroke-width="4"/>
    <circle cx="120" cy="120" r="45" fill="#00d082" opacity="0.8"/>
    <!-- Patient Table line -->
    <rect x="-20" y="112" width="150" height="16" rx="8" fill="#ffffff"/>
  </g>

  <!-- Content Elements -->
  <g transform="translate(60, 90)">
    <!-- Pill tag -->
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#fef84c"/>
    <text x="85" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#064e3b" text-anchor="middle">SEMINAR NASIONAL</text>

    <text x="0" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
      Optimalisasi CT &amp; MRI
    </text>
    <text x="0" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#00d082">
      Deteksi Penyakit Vaskular
    </text>
    <text x="0" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0">
      Diselenggarakan oleh BEM STIKes Borneo Nusantara
    </text>
    <text x="0" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#fef84c">
      ★ Terakreditasi SKP PARI
    </text>
  </g>

  <!-- Bottom Bar -->
  <rect x="60" y="400" width="680" height="50" rx="12" fill="#ffffff" opacity="0.15"/>
  <text x="90" y="432" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    Narasumber Spesialis Radiologi &amp; Praktisi Imaging Digital Medis
  </text>
</svg>
