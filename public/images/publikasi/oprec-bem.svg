    </text>
  </g>

  <rect x="60" y="400" width="680" height="50" rx="12" fill="#ffffff" opacity="0.15"/>
  <text x="90" y="432" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    Kunjungi link di Bio Instagram: @bem.atrocip
