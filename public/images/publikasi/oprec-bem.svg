<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oprecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f21"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#00d082"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#oprecBg)"/>

  <!-- Graphic Accents -->
  <circle cx="700" cy="80" r="120" fill="#fef84c" opacity="0.15"/>
  <circle cx="100" cy="400" r="140" fill="#00d082" opacity="0.2"/>

  <!-- Main Card Illustration -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="280" height="280" rx="20" fill="#ffffff" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.25))"/>
    <circle cx="140" cy="80" r="45" fill="#fef84c"/>
    <text x="140" y="93" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" text-anchor="middle">🌟</text>
    <text x="140" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#064e3b" text-anchor="middle">JOIN THE TEAM</text>
    <text x="140" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00d082" text-anchor="middle">BEM DIII Radiologi</text>
    <rect x="50" y="215" width="180" height="36" rx="18" fill="#00d082"/>
    <text x="140" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DAFTAR SEKARANG</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#fef84c"/>
    <text x="95" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#064e3b" text-anchor="middle">OPEN RECRUITMENT</text>

    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#ffffff">
      Panitia PORSENI &amp;
    </text>
    <text x="0" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#fef84c">
      Staf Magang BEM
    </text>

    <text x="0" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#f0fdf4">
