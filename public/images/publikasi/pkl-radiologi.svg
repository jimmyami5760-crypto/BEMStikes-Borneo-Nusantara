<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d082"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef84c"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Hospital & Radiology Motif Illustration -->
  <g transform="translate(120, 80)">
    <!-- Hospital Cross Card -->
    <rect x="0" y="0" width="220" height="260" rx="20" fill="#ffffff" opacity="0.95" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.2))"/>
    <!-- Medical Cross -->
    <path d="M 90,60 L 130,60 L 130,100 L 170,100 L 170,140 L 130,140 L 130,180 L 90,180 L 90,140 L 50,140 L 50,100 L 90,100 Z" fill="#00d082"/>
    <circle cx="110" cy="120" r="16" fill="#fef84c"/>
    <text x="110" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#064e3b" text-anchor="middle">HOSPITAL INTERNSHIP</text>
  </g>

  <!-- Decorative X-Ray Film Representation -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="260" height="280" rx="16" fill="#0b2319" stroke="#00d082" stroke-width="4"/>
    <!-- Simulated Ribs / Chest X-Ray lines -->
    <ellipse cx="130" cy="90" rx="25" ry="15" fill="none" stroke="#fef84c" stroke-width="3" opacity="0.8"/>
    <path d="M 60,110 Q 130,130 200,110" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <path d="M 50,140 Q 130,165 210,140" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <path d="M 55,170 Q 130,195 205,170" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <path d="M 65,200 Q 130,225 195,200" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <line x1="130" y1="80" x2="130" y2="240" stroke="#fef84c" stroke-width="4" stroke-dasharray="6,4"/>
  </g>

  <!-- Title Badge Banner -->
  <rect x="50" y="380" width="700" height="85" rx="14" fill="#ffffff" opacity="0.95"/>
  <text x="80" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#064e3b">
    PRAKTIK KERJA LAPANGAN (PKL) RADIOLOGI
  </text>
  <text x="80" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00d082">
    STIKes Borneo Nusantara • Rumah Sakit Jejaring Pendidikan Kalsel
  </text>
  <circle cx="700" cy="422" r="14" fill="#fef84c"/>
  <text x="700" y="427" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#064e3b" text-anchor="middle">✓</text>
</svg>
