<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wrdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c1e"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#00d082"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="20" fill="url(#wrdGrad)"/>

  <!-- Border -->
  <rect x="25" y="25" width="550" height="750" rx="16" fill="none" stroke="#fef84c" stroke-width="2.5"/>

  <!-- Radiation glow rings -->
  <circle cx="300" cy="360" r="150" fill="none" stroke="#00d082" stroke-width="2" stroke-dasharray="8,8" opacity="0.6"/>
  <circle cx="300" cy="360" r="100" fill="none" stroke="#fef84c" stroke-width="3" opacity="0.8"/>
  <circle cx="300" cy="360" r="50" fill="#fef84c"/>

  <text x="300" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#fef84c" text-anchor="middle" letter-spacing="3">
    PERINGATAN TAHUNAN
  </text>
  <text x="300" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">
    WORLD RADIOGRAPHY DAY
  </text>
  <text x="300" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#00d082" text-anchor="middle">
    8 NOVEMBER
  </text>

  <!-- Atomic symbol orbits -->
  <ellipse cx="300" cy="360" rx="140" ry="50" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(30 300 360)"/>
  <ellipse cx="300" cy="360" rx="140" ry="50" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(-30 300 360)"/>

  <!-- Quote Box -->
  <g transform="translate(60, 560)">
    <rect width="480" height="140" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="240" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#064e3b" text-anchor="middle">
      "Melihat yang Tak Kasat Mata,"
    </text>
    <text x="240" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#064e3b" text-anchor="middle">
      "Mendiagnosa demi Keselamatan Nyawa."
    </text>
    <text x="240" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00d082" text-anchor="middle">
      Keluarga Besar BEM STIKes Borneo Nusantara
    </text>
  </g>

  <text x="300" y="745" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fef84c" text-anchor="middle">
    @bem.atrocip • DIII Radiologi STIKes Borneo Nusantara
  </text>
</svg>
