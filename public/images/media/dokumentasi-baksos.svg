<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="baksosMediaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#00d082"/>
      <stop offset="100%" stop-color="#fef84c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="20" fill="url(#baksosMediaGrad)"/>

  <!-- Center Frame -->
  <rect x="30" y="30" width="540" height="740" rx="16" fill="#ffffff" opacity="0.96"/>

  <g transform="translate(300, 90)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#00d082"/>
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">DOKUMENTASI KEGIATAN</text>
  </g>

  <text x="300" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#064e3b" text-anchor="middle">
    Bakti Sosial Pemeriksaan
  </text>
  <text x="300" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#00d082" text-anchor="middle">
    Kesehatan Warga Pekapuran
  </text>

  <!-- Illustration graphic -->
  <g transform="translate(300, 350)">
    <circle cx="0" cy="0" r="110" fill="#ecfdf5"/>
    <circle cx="0" cy="0" r="90" fill="#fef84c" opacity="0.4"/>
    <!-- Heart & Cross -->
    <path d="M 0,50 L -35,10 C -60,-20 -20,-60 0,-30 C 20,-60 60,-20 35,10 Z" fill="#00d082"/>
    <circle cx="0" cy="0" r="15" fill="#fef84c"/>
  </g>

  <!-- Details block -->
  <g transform="translate(60, 520)">
    <rect width="480" height="180" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="30" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#064e3b">
      📍 Lokasi: Balai Warga Pekapuran Laut, Banjarmasin
    </text>
    <text x="30" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#064e3b">
      👥 Partisipan: 120+ Warga &amp; Lansia
    </text>
    <text x="30" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#064e3b">
      🤝 Kolaborasi: Tim BEM &amp; Dosen Pembina Radiologi
    </text>
    <text x="30" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00d082">
      "Mengabdi dengan Hati, Mencerahkan Masa Depan Kesehatan"
    </text>
  </g>
