<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pelantikanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#00d082"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="20" fill="url(#pelantikanGrad)"/>

  <!-- Podium & Flags Illustration -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="-60" r="140" fill="#fef84c" opacity="0.2"/>
    <rect x="-180" y="60" width="360" height="120" rx="16" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#064e3b" text-anchor="middle">PELANTIKAN PENGURUS</text>
    <text x="0" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#00d082" text-anchor="middle">BEM STIKes Borneo Nusantara</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 110)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#fef84c"/>
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#064e3b" text-anchor="middle">DOKUMENTASI RESMI</text>
  </g>

  <text x="300" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">
    Pelantikan &amp; Serah Terima
  </text>
  <text x="300" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#fef84c" text-anchor="middle">
    Jabatan Periode 2025/2026
  </text>

  <!-- Info Box -->
  <g transform="translate(50, 560)">
    <rect width="500" height="180" rx="16" fill="#ffffff"/>
    <text x="40" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#064e3b">
      🏛️ Tempat : Aula Utama STIKes Borneo Nusantara
    </text>
    <text x="40" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#064e3b">
      📅 Tanggal : 15 Desember 2025
    </text>
    <text x="40" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#475569">
      Dihadiri segenap Pimpinan STIKes, Dosen Prodi Radiologi, dan seluruh perwakilan organisasi mahasiswa.
    </text>
  </g>
</svg>
