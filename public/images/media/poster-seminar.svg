<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c1e"/>
      <stop offset="100%" stop-color="#00d082"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="20" fill="url(#posterGrad)"/>
  
  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="#fef84c" stroke-width="3" opacity="0.8"/>

  <!-- Header Header badge -->
  <g transform="translate(300, 70)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#fef84c"/>
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="1">
      SEMINAR NASIONAL 2026
    </text>
  </g>

  <text x="300" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">
    OPTIMALISASI PROTOKOL
  </text>
  <text x="300" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#00d082" text-anchor="middle">
    CT-SCAN &amp; MRI
  </text>
  <text x="300" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#fef84c" text-anchor="middle">
    DALAM DETEKSI DINI VASKULAR
  </text>

  <!-- Illustration Centerpiece -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.08"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#fef84c" stroke-width="4" stroke-dasharray="10,6"/>
    <!-- Radiation fan -->
    <path d="M -15,-35 A 40,40 0 0,1 15,-35 L 0,-5 Z" fill="#00d082"/>
    <g transform="rotate(120)">
      <path d="M -15,-35 A 40,40 0 0,1 15,-35 L 0,-5 Z" fill="#00d082"/>
    </g>
    <g transform="rotate(240)">
      <path d="M -15,-35 A 40,40 0 0,1 15,-35 L 0,-5 Z" fill="#00d082"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="#fef84c"/>
  </g>

  <!-- Key Info Cards -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="480" height="150" rx="16" fill="#ffffff" opacity="0.95"/>
    <text x="240" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#064e3b" text-anchor="middle">
      🗓️ Sabtu, 15 Februari 2026 | 08.00 WITA - Selesai
    </text>
    <text x="240" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">
      📍 Aula Kampus STIKes Borneo Nusantara
    </text>
    <text x="240" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#00d082" text-anchor="middle">
      ✓ Sertifikat Terakreditasi 2 SKP PARI
    </text>
  </g>

  <!-- Footer contact -->
  <text x="300" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    BEM STIKes Borneo Nusantara • Instagram: @bem.atrocip
  </text>
</svg>
